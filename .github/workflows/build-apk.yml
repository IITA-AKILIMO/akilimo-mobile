name: Build APK

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_artifacts:
    runs-on: ubuntu-24.04
    name: Build artifacts
    permissions:
      contents: write # upload assets to the draft GitHub Release
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      track: ${{ steps.track.outputs.track }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_NAME: ${{ secrets.REPO_NAME }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      MAPBOX_RUNTIME_TOKEN: ${{ secrets.MAPBOX_RUNTIME_TOKEN }}
      AKILIMO_API_KEY: ${{ secrets.AKILIMO_API_KEY }}
      LOCATION_IQ_TOKEN: ${{ secrets.LOCATION_IQ_TOKEN }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      PACKAGE_NAME: ${{ vars.APP_PACKAGE }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4.9.1
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Get and set name of current branch
        run: echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Display current branch name
        run: echo ${BRANCH_NAME}

      # Determine release track from tag
      - name: Determine release track
        id: track
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"beta"* ]]; then
            echo "track=beta" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"alpha"* ]] || [[ "$TAG" == *"rc"* ]]; then
            echo "track=beta" >> $GITHUB_OUTPUT
          else
            echo "track=production" >> $GITHUB_OUTPUT
          fi

      # FETCH VERSION_CODE
      - name: Get build version
        id: get_version
        run: |
          # -f makes HTTP errors fail so the fallback fires; reject non-numeric bodies too
          VERSION_CODE=$(curl -fsS https://munywele.co.ke/app-releases/akilimo || true)
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::warning::Version endpoint returned no numeric code; falling back to run_number"
            VERSION_CODE=${{ github.run_number }}
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "RELEASE_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "Using VERSION_CODE: $VERSION_CODE"
          echo "Using RELEASE_VERSION: ${{ github.ref_name }}"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          # The action's default is "tools platform-tools", but the legacy "tools" package
          # no longer exists in cmdline-tools 16+, so sdkmanager fails. Gradle downloads
          # the platform/build-tools it needs.
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.3
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate android AAB and APK
        run: |
          echo "Building APK and AAB from source..."
          echo "Using VERSION_CODE: $VERSION_CODE"
          echo "Using RELEASE_VERSION: $RELEASE_VERSION"
          ./gradlew bundleRelease assembleRelease -x test \
            -PMAPBOX_DOWNLOADS_TOKEN=${{ secrets.MAPBOX_DOWNLOADS_TOKEN }} \
            -PRELEASE_VERSION=${{ github.ref_name }} \
            -PVERSION_CODE=${{ steps.get_version.outputs.version_code }}

      # Verify build outputs exist
      - name: Verify build outputs
        run: |
          if [ ! -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "APK not found after build!"
            exit 1
          fi
          if [ ! -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "AAB not found after build!"
            exit 1
          fi
          echo "Build artifacts verified"
          echo "APK size: $(du -h app/build/outputs/apk/release/app-release-unsigned.apk | cut -f1)"
          echo "AAB size: $(du -h app/build/outputs/bundle/release/app-release.aab | cut -f1)"

      - name: Create release folder
        run: mkdir -p release

      - name: Sign AAB
        uses: ilharp/sign-android-release@v2.0.0
        id: sign_aab
        with:
          releaseDir: app/build/outputs/bundle/release
          signingKey: ${{ secrets.KEYSTORE_FILE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        id: sign_apk
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE_FILE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Copy and rename signed APK and AAB
        run: |
          # Rename APK
          for file in ${{ steps.sign_apk.outputs.signedFiles }}; do
            cp "$file" "release/akilimo-release.apk"
          done

          # Rename AAB
          for file in ${{ steps.sign_aab.outputs.signedFiles }}; do
            cp "$file" "release/akilimo-release.aab"
          done

      # Upload signed binaries to GitHub Release (draft) so publish.yml can download them
      - name: Upload release assets
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Build ${{ github.ref_name }}"
          draft: true
          files: |
            release/akilimo-release.apk
            release/akilimo-release.aab
            release/distribution/whatsnew/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify_approval:
    needs: build_artifacts
    name: Notify for approval
    runs-on: ubuntu-24.04

    steps:
      - name: Send approval request to n8n
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "event": "playstore_publish_approval",
            "repo": "${{ github.repository }}",
            "tag": "${{ github.ref_name }}",
            "version": "${{ needs.build_artifacts.outputs.version }}",
            "track": "${{ needs.build_artifacts.outputs.track }}",
            "actor": "${{ github.actor }}",
            "run_id": "${{ github.run_id }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "chat_id": "${{ vars.TELEGRAM_CHAT_ID }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          )

          # Generate HMAC signature
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.N8N_WEBHOOK_SECRET }}" | awk '{print $2}')

          curl -s -X POST "${{ vars.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -d "$PAYLOAD"

          echo "Approval request sent to n8n"

  # If the build fails, remove the release and tag created for it (by github-release.yml or
  # the upload step) so no orphaned release without artifacts is left behind, and the next
  # merge to main can tag the version again. Failures in later jobs (approval/publish) keep
  # the release: the signed artifacts exist and the publish can simply be re-run.
  cleanup_failed_release:
    needs: build_artifacts
    if: failure() && github.ref_type == 'tag'
    name: Remove release for failed build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # delete the release and tag

    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
            echo "Deleted release and tag $TAG"
          else
            # No release yet (failure happened before one was created): remove the tag only
            gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" \
              && echo "Deleted tag $TAG" \
              || echo "Tag $TAG already gone"
          fi
          echo "::warning::Build for $TAG failed; its release and tag were removed. Fix the build and re-release."
