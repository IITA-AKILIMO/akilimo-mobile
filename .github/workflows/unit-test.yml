name: CI Checks

on:
  push:
    branches: [develop]
    paths:
      - 'app/src/**'
      - '.github/**'
      - '**/*.gradle*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
  pull_request:
    paths:
      - 'app/src/**'
      - '.github/**'
      - '**/*.gradle*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

concurrency:
  group: ci-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
  MAPBOX_RUNTIME_TOKEN: ${{ secrets.MAPBOX_RUNTIME_TOKEN }}
  AKILIMO_API_KEY: ${{ secrets.AKILIMO_API_KEY }}
  LOCATION_IQ_TOKEN: ${{ secrets.LOCATION_IQ_TOKEN }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    name: Unit tests, Lint & Detekt
    outputs:
      release_version: ${{ steps.get_version.outputs.release_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Install tag fetcher
        run: pip install latest_tag

      - name: Fetch latest tag
        id: get_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
        run: |
          fetch-tag > latest_tag.txt
          echo "RELEASE_VERSION=$(cat latest_tag.txt)" >> $GITHUB_ENV
          echo "release_version=$(cat latest_tag.txt)" >> $GITHUB_OUTPUT

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests, lint & detekt
        run: ./gradlew testDebugUnitTest lintDebug detekt --no-daemon -PMAPBOX_DOWNLOADS_TOKEN=${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

      - name: Check Room schema drift
        uses: tj-actions/verify-changed-files@v20
        id: schema_drift
        with:
          files: app/schemas/**

      - name: Fail on Room schema drift
        if: steps.schema_drift.outputs.files_changed == 'true'
        run: |
          echo "::error::Room schema files changed without a version bump or uncommitted schema export."
          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 7

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-results
          path: build/reports/detekt/
          retention-days: 7
