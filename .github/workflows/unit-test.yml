name: CI Checks

# Files that change what the checks see. The Room schemas, the detekt and lint settings and the Gradle files are outside
# app/src, so they are listed too: a schema-only change must still run the schema drift check.
on:
  push:
    paths:
      - 'app/src/**'
      - 'app/schemas/**'
      - 'app/*.xml'
      - 'app/*.yml'
      - 'app/*.pro'
      - 'app/*.json'
      - '.github/**'
      - '**/*.gradle*'
      - 'gradle.properties'
      - 'gradle/**'
  # Every pull request, not only those into develop, so a stacked branch is checked as well
  pull_request:
    paths:
      - 'app/src/**'
      - 'app/schemas/**'
      - 'app/*.xml'
      - 'app/*.yml'
      - 'app/*.pro'
      - 'app/*.json'
      - '.github/**'
      - '**/*.gradle*'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:

# Runs of the same kind on one branch replace each other. A push run and a pull-request run never do: the gate job below skips
# the push run when a pull request is open, because cancelling one of the two would leave a cancelled check on the pull request
concurrency:
  group: ci-checks-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A push to a branch that has an open pull request is checked by the pull request's own run, so the push run is skipped here.
  # Without this, the push run and the pull-request run check the same commit, one of them is cancelled, and GitHub shows a
  # cancelled (not passing) check on the pull request. Pushes to branches without a pull request still run.
  gate:
    name: Decide whether to run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          run=true

          if [ "$EVENT" = "push" ]; then
            # An open pull request runs the same checks on this commit, so the push run would only duplicate it
            open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo 0)"
            if [ "${open:-0}" != "0" ]; then
              run=false
              echo "A pull request is open for $BRANCH, so its own run checks this commit. This push run is skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"

  checks:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    name: Unit tests, Lint & Detekt
    timeout-minutes: 30

    # Only what the build needs to download the Mapbox SDK. The other keys (the AKILIMO API key, map, weather and geocoding
    # tokens) are not needed by unit tests, lint or detekt: the build falls back to empty values, and pull-request code
    # must not be able to read the real ones.
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # --continue: a failing test must not stop lint and detekt from running, so one run reports everything that is wrong.
      # The Mapbox token comes from the environment (settings.gradle.kts reads it), not from -P on the command line.
      - name: Run unit tests, lint & detekt
        run: ./gradlew testDebugUnitTest lintDebug detekt --continue --build-cache

      # Plain git instead of tj-actions/verify-changed-files (compromised in 2025). Runs even when the checks above failed.
      - name: Fail on Room schema drift
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --porcelain -- app/schemas
            echo "::error::Room schema files changed without a version bump or uncommitted schema export."
            exit 1
          fi

      - name: Summarise the test results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not files:
              print("## Unit tests\n\nNo test report was written (the build stopped before the tests ran).")
              raise SystemExit

          total = failed = skipped = 0
          failures = []
          for path in files:
              for case in ET.parse(path).getroot().iter("testcase"):
                  total += 1
                  if case.find("skipped") is not None:
                      skipped += 1
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed += 1
                      failures.append(f"{case.get('classname', '').split('.')[-1]}: {case.get('name', '')}")

          print(f"## Unit tests\n\n{total} run, {failed} failed, {skipped} skipped.\n")
          for line in failures[:30]:
              print(f"- `{line}`")
          if len(failures) > 30:
              print(f"- ... and {len(failures) - 30} more")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lint-results
          path: app/build/reports/custom-lint-results.xml
          retention-days: 7

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: detekt-results
          path: app/build/reports/detekt/
          retention-days: 7
