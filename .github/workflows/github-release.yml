name: GitHub Release

on:
  pull_request:
    branches:
      - main
    types: [closed]
  workflow_dispatch:

concurrency:
  # Scope by the TARGET branch (main), not the PR's head branch.
  # Two PRs merging close together must queue and tag sequentially,
  # not race — cancel-in-progress: false so a release never gets
  # killed mid-tag-push, leaving a dangling tag/changelog mismatch.
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # Only release on: (a) an actual merge to main, or (b) a manual
    # dispatch that is explicitly run against main — dispatch from
    # any other ref would tag/release the wrong code.
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    name: Create release tag
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          # github.sha on a `pull_request: closed` event is the PR's
          # ephemeral test-merge commit, NOT the commit that landed
          # on main. merge_commit_sha (or the branch itself for
          # dispatch) is the actual commit to release.
          ref: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.merge_commit_sha
                || 'main' }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

#      - name: Commit and push changelog
#        uses: stefanzweifel/git-auto-commit-action@v5
#        with:
#          commit_message: "docs: update changelog"
#          file_pattern: CHANGELOG.md
#          commit_user_name: "munywele-sonar[bot]"
#          commit_user_email: "munywele-sonar[bot]@users.noreply.github.com"

      - name: Generate Tag
        id: tag_version
        uses: masgeek/github-tag-action@release
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag_prefix: ""
          create_annotated_tag: true

      - name: Verify tag was produced
        run: |
          if [ -z "${{ steps.tag_version.outputs.new_tag }}" ]; then
            echo "::error::tag_version produced no new_tag — refusing to create a release."
            exit 1
          fi
          echo "New tag: ${{ steps.tag_version.outputs.new_tag }}"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Version ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          makeLatest: true
          allowUpdates: true