name: Publish to Play Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag'
        required: true
        type: string
      artifact_name:
        description: 'GitHub Actions artifact name to download'
        required: true
        default: 'app-release'
        type: string
      track:
        description: 'Play Store track'
        required: true
        type: choice
        options:
          - beta
          - production
      approved_by:
        description: 'Telegram user who approved'
        required: false
        type: string

jobs:
  publish_to_playstore:
    name: Publish to Google PlayStore
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: release

      - name: Verify artifact contents
        run: |
          if [ ! -f "release/akilimo-release.aab" ]; then
            echo "AAB not found in artifact!"
            exit 1
          fi
          echo "AAB size: $(du -h release/akilimo-release.aab | cut -f1)"

      - name: Upload Beta Release
        if: inputs.track == 'beta'
        id: upload_beta
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          packageName: ${{ secrets.APP_PACKAGE }}
          releaseFiles: release/akilimo-release.aab
          tracks: beta
          status: completed
          whatsNewDirectory: release/distribution/whatsnew

      - name: Upload Production Release
        if: inputs.track == 'production'
        id: upload_prod
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          packageName: ${{ secrets.APP_PACKAGE }}
          releaseFiles: release/akilimo-release.aab
          tracks: production
          status: completed
          whatsNewDirectory: release/distribution/whatsnew

      - name: Update build number
        if: >
          steps.upload_beta.outcome == 'success' ||
          steps.upload_prod.outcome == 'success'
        run: |
          curl -s https://munywele.co.ke/app-releases/akilimo/update

      - name: Send success webhook
        if: >
          steps.upload_beta.outcome == 'success' ||
          steps.upload_prod.outcome == 'success'
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ vars.WEBHOOK_URL }}
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          data: >
            {
              "event": "playstore_upload",
              "status": "success",
              "track": "${{ inputs.track }}",
              "tag": "${{ env.RELEASE_VERSION }}",
              "approved_by": "${{ inputs.approved_by }}",
              "repo": "${{ github.repository }}",
              "package": "${{ secrets.APP_PACKAGE }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Send failure notification
        if: failure()
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ vars.WEBHOOK_URL }}
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          data: >
            {
              "event": "playstore_upload",
              "status": "failed",
              "track": "${{ inputs.track }}",
              "tag": "${{ env.RELEASE_VERSION }}",
              "repo": "${{ github.repository }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  upload_beta_artifacts:
    if: inputs.track == 'beta'
    needs: publish_to_playstore
    name: Upload to GitHub beta
    runs-on: ubuntu-latest
    env:
      GHR_TAG: "${{ inputs.version }}-beta"
      GHR_REPLACE: "1"
      GHR_PATH: release
      GHR_PRERELEASE: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: release

      - run: |
          cp release/distribution/whatsnew/* release
          rm -rf release/distribution

      - name: Upload release artifacts
        uses: masgeek/github-action-ghr@v1.3.2

  upload_production_artifacts:
    if: inputs.track == 'production'
    needs: publish_to_playstore
    name: Upload to GitHub release
    runs-on: ubuntu-latest
    env:
      GHR_TAG: "${{ inputs.version }}"
      GHR_REPLACE: "1"
      GHR_PATH: release
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: release

      - run: |
          cp release/distribution/whatsnew/* release
          rm -rf release/distribution

      - name: Upload production artifacts
        uses: masgeek/github-action-ghr@v1.3.2
