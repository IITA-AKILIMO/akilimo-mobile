name: Publish to Play Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag'
        required: true
        type: string
      track:
        description: 'Play Store track'
        required: true
        type: choice
        options:
          - beta
          - production
      approved_by:
        description: 'Telegram user who approved'
        required: false
        type: string

jobs:
  publish_to_playstore:
    name: Publish to Google PlayStore
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Download release assets from GitHub Release
        run: |
          mkdir -p release/distribution/whatsnew
          # Download the AAB from the draft release
          gh release download "${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.aab" \
            --dir release \
            --clobber
          # Also download the APK
          gh release download "${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir release \
            --clobber || true
          # Download whatsnew files
          gh release download "${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "whatsnew-*" \
            --dir release/distribution/whatsnew \
            --clobber || true
          ls -la release/
          ls -la release/distribution/whatsnew/ || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify AAB exists
        run: |
          if [ ! -f "release/akilimo-release.aab" ]; then
            echo "AAB not found in release!"
            exit 1
          fi
          echo "AAB size: $(du -h release/akilimo-release.aab | cut -f1)"

      - name: Upload Beta Release
        if: inputs.track == 'beta'
        id: upload_beta
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          packageName: ${{ secrets.APP_PACKAGE }}
          releaseFiles: release/akilimo-release.aab
          tracks: beta
          status: completed
          whatsNewDirectory: release/distribution/whatsnew

      - name: Upload Production Release
        if: inputs.track == 'production'
        id: upload_prod
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          packageName: ${{ secrets.APP_PACKAGE }}
          releaseFiles: release/akilimo-release.aab
          tracks: production
          status: completed
          whatsNewDirectory: release/distribution/whatsnew

      - name: Update build number
        if: >
          steps.upload_beta.outcome == 'success' ||
          steps.upload_prod.outcome == 'success'
        run: |
          curl -s https://munywele.co.ke/app-releases/akilimo/update

      - name: Send success webhook
        if: >
          steps.upload_beta.outcome == 'success' ||
          steps.upload_prod.outcome == 'success'
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ vars.WEBHOOK_URL }}
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          data: >
            {
              "event": "playstore_upload",
              "status": "success",
              "track": "${{ inputs.track }}",
              "tag": "${{ env.RELEASE_VERSION }}",
              "approved_by": "${{ inputs.approved_by }}",
              "repo": "${{ github.repository }}",
              "package": "${{ secrets.APP_PACKAGE }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Send failure notification
        if: failure()
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ vars.WEBHOOK_URL }}
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          data: >
            {
              "event": "playstore_upload",
              "status": "failed",
              "track": "${{ inputs.track }}",
              "tag": "${{ env.RELEASE_VERSION }}",
              "repo": "${{ github.repository }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Cleanup draft release on failure
        if: failure()
        run: |
          gh release delete "${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --yes \
            --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
