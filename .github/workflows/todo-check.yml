name: TODO Check

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write # tdg-github-action opens/closes TODO issues

jobs:
  todo_check:
    runs-on: ubuntu-24.04
    name: Scan TODOs

    steps:
      - uses: actions/checkout@v4.4.0

      - name: Run tdg-github-action
        uses: ribtoks/tdg-github-action@v0.4.17-beta
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          LABEL: "TODO"
          INCLUDE_PATTERN: "\\.(kt|kts)$"
