name: Auto Approve PR

on:
  workflow_run:
    workflows: ["CI Checks"]
    types: [completed]

concurrency:
  group: auto-approve-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

# Logins whose pull requests may be auto-approved, separated by spaces. GitHub CLI spells a bot as `name[bot]` or `app/name`,
# so both forms are listed. To change the list without editing this file, set a repository variable called ALLOWED_BOTS.
env:
  ALLOWED_BOTS: ${{ vars.ALLOWED_BOTS || 'github-actions[bot] dependabot[bot] app/dependabot munywele-bot[bot] app/munywele-bot' }}

jobs:
  pr-auto-approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Gate everything here, in one place, at the job level.
    # - only react to PR-triggered runs that succeeded
    # - only react to runs from the base repo (never a fork's copy of
    #   the workflow — a fork PR could edit "CI Checks" to always pass,
    #   and workflow_run inherits write perms against the base repo)
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Get PR details
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --search "${{ github.event.workflow_run.head_sha }}" \
            --state all \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found for commit ${{ github.event.workflow_run.head_sha }} — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "author=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json author --jq '.author.login')" >> "$GITHUB_OUTPUT"

      - name: Check author is an allowed bot
        if: steps.pr.outputs.skip != 'true'
        id: gate
        env:
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
        run: |
          read -ra bots <<< "$ALLOWED_BOTS"
          
          if [[ " ${bots[*]} " == *" $PR_AUTHOR "* ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Author '$PR_AUTHOR' is allowed."
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Author '$PR_AUTHOR' is not an allowed bot — skipping."
          fi

      - name: Generate GitHub App Token
        if: steps.gate.outputs.allowed == 'true'
        id: generate-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Auto approve PR
        if: steps.gate.outputs.allowed == 'true'
        uses: hmarr/auto-approve-action@v4.0.0
        with:
          review-message: "Auto approved — CI checks passed"
          # This runs after another workflow, not on a pull_request event, so the action must be told which pull request to approve
          pull-request-number: ${{ steps.pr.outputs.number }}
          github-token: ${{ steps.generate-token.outputs.token }}